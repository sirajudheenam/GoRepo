apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rest-server
  template:
    metadata:
      labels:
        app: rest-server
    spec:
      containers:
      - name: rest-server
        image: rest-server:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: rest-service
spec:
  selector:
    app: rest-server
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
